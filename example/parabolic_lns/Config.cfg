&InitialSettings
!========== Model Settings ==========
                    ModelType   =       1,    ! 1: 2.5D Model with Homogeneous Zeta
                                              ! 2: 3D Model with singular line, using the spherical coordinate system

!========== Analysis Settings =======
                    AnalysisType=       3,    ! 1: Steady NS Solver
                                              ! 2: Unsteady NS Solver
                                              ! 3: LNS Solver
                                              ! 4: HLNS Solver

!==========   Grid Settings   ==========
         Geometry_Type          =       2,    ! Geometric selection(1:Round; 2:parabola)

                    Nx          =      81,    ! Total grid along Xi

                    Nx_head     =      81,    ! Grid along round head

                    Ny          =      51,    ! Total grid along eta directions

                    Nz          =       8,    ! Total grid along Zeta directions

                    xim         =   0.4d0,    ! Compress parameters (0,0.5)

                    sigma_y     =  0.75d0,    ! The first compress coefficient

                    yim         =   0.2d0,    ! The second compress coefficient

                    Lz_start    =    0.d0,    ! Start position of the z direction

                    Lz_end      =    5.d0,    ! End position of the z direction

                    R_head      =    0.125,    ! Radius of the head

                    LModel      =    0.d0,    ! length of the model

                    theta_p_deg =    0.d0,    ! flate wall angle

!==========   CFD  Settings   ==========      !
!
                    AoA_Deg     =    0.d0,    ! angle of attack in degree

                    AoS_Deg     =    0.d0,    ! angle of sweep in degree

                    Re_Ref      =  6026.6,    ! reference Reynolds number

                    Te_Ref      = 192.989,    ! reference Temperature

                    Mach_Ref    =   15.d0,    ! reference Mach numbers

                    Pr_Ref      =    0.72,    ! reference Prandtl number

                    Gamma       =     1.4,    ! specific ratio of heat

                    TWall       =  5.1816d0,    ! Surface temperature ratio Twall/Te_Ref
                                              ! Surface adiabatic wall: TWall = -1.d0
!========== Parallel Settings ==========

                    npx0        =       1,    ! Number of processors in x-direction

                    npz0        =       1,    ! Number of processors in z-direction

!========== Temporal Settings  ==========
!
!     Continue Calculation = 1
!          New Calculation = 0
!
           IF_FixedDeltaTime      =       0,  ! 0:CFL; 1:fixed dt

           FixedDeltaTime         =       4d-4,

           IF_Continue_Calculate  =       0,  ! Calculation Mode
!                                  50000001,  ! Default: 50000001
           TotalTimeSteps         =50000001,  ! Total Time Steps for simulations

           StepsOutputScreen      =      50,  ! Steps to output residuals on screen

            StepsWriteData         =    500,  ! Steps to output the transient results

           StepChangeCFLStart     =   10000,  ! Initial calculation steps for CFL_Start

           StepChangeCFL          =   10000,  ! CFL changes for CFL_Start to CFL_End

           CFL_Start              =     0.1,  ! Initial CFL numbers

           CFL_End                =     5.0,  ! CFL end for changes (suggest 2~3)

!
!==========  Temporal Schemes  ==========
!
!              RK4_Methods = 1
!             DPLR_Methods = 2
!            GMRES_Methods = 3
!         MultiGridMethods = 4
!              LNS_Methods = 5
!

    Select_Kind_Solver     =  1,

!
!====   Precondition Solver   ===========
!               No_precond = 0
!             DPLR_precond = 1
!         MultGrid_precond = 2
!

 Select_Kind_Precon_Solver = 0,

!
!
!====  Select Spatial Scheme  ===========
!           first_order = 1_ik
!           fifth_order = 5_ik
!           weno5_order = 6_ik
!           hybird_sch  = 7_ik

             Select_Scheme = 5,

!==========  Output  Settings  ==========
! Output Residual Mode(1.Brief;2.Detail)
      Output_Residual_Mode = 1,

!==========  perturbation mode  ==========
! perturbation Mode(1.fast;2.slow)
         Pert_Type = 1
         k_infty  = 15
         epsilon  = 5e-4
         LNS_STEPS_MAX = 50000000
         LNS_dt   = 6e-6

!     Continue LNS Calculation = 1
!          New LNS Calculation = 0
 IF_Continue_LNS  =   0,  ! Calculation Mode
/
